[tool.poetry]
name = "mcpinspect"
version = "0.1.0"
description = "Offline-first, CI-native MCP security scanner. No telemetry, no cloud API calls, ever."
license = "Apache-2.0"
authors = ["mcpinspect contributors"]
readme = "README.md"
keywords = ["mcp", "security", "llm-security", "agent", "prompt-injection", "tool-poisoning", "rug-pull"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
packages = [{ include = "mcpinspect" }]

[tool.poetry.urls]
Homepage = "https://github.com/yourusername/mcpinspect"
"Bug Tracker" = "https://github.com/yourusername/mcpinspect/issues"

[tool.poetry.scripts]
mcpinspect = "mcpinspect.cli:app"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
typer = { extras = ["all"], version = ">=0.9,<1.0" }
rich = ">=13.0"
httpx = ">=0.25"
anyio = ">=4.0"
pydantic = ">=2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-httpserver = ">=1.0"
pytest-cov = ">=4.0"
ruff = ">=0.1.0"
mypy = ">=1.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
omit = [
    "mcpinspect/transport/stdio.py",
    "mcpinspect/cli.py"
]
